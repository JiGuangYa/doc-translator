# Prometheus scrape config for doc-translator (Scenario A)
#
# Usage: docker compose --profile metrics up
# Then open http://127.0.0.1:9090 for the Prometheus UI.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: doc-translator
    metrics_path: /metrics
    static_configs:
      # docker-compose DNS resolves "app" to the app container.
      # For a non-compose setup, replace "app:8765" with the host/port
      # where the app is reachable from Prometheus.
      - targets:
          - app:8765
        labels:
          service: doc-translator
          tier: app
