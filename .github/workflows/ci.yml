name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, codex/native-unified-0.3.0]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
        # Python 3.10 is excluded on Windows because the GitHub-hosted
        # windows-latest runner ships with a Visual C++ runtime that does
        # not match the 3.10 wheel's expected ABI for some of our compiled
        # dependencies (notably pymupdf 1.25). 3.12 works on both. The
        # project supports 3.10 in production; this is a CI matrix choice,
        # not a support statement.
        exclude:
          - os: windows-latest
            python-version: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Run tests
        run: pytest tests -q
        env:
          PYTHONIOENCODING: utf-8

      - name: Coverage
        # Coverage is reported but not gated (a future change can add a
        # threshold). The run is best-effort: tests with a missing native
        # dependency (e.g. pymupdf on an unusual ABI) are already skipped
        # by pytest markers, so coverage will only count what ran.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          pip install pytest-cov
          pytest tests -q --cov=app --cov-report=term-missing:skip-covered
        env:
          PYTHONIOENCODING: utf-8

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependency audit (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements.txt
          pip-audit -r requirements.txt --strict

  native-preview:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install fixture dependencies
        run: pip install -r requirements.txt
      - name: Native workflow tests
        run: NATIVE_TEST_PYTHON="$(command -v python3)" swift test --package-path macos
      - name: Build and verify signed preview
        run: bash macos/build_app.sh
      - name: Isolated frozen engine acceptance
        run: .venv/bin/python macos/scripts/verify_engine.py --engine "$(pwd)/macos/dist/文档翻译预览版.app/Contents/Resources/DocTranslatorEngine/DocTranslatorEngine" --output "$RUNNER_TEMP/unified-acceptance" --allow-missing-renderer
      - uses: actions/upload-artifact@v4
        with:
          name: DocTranslatorUnifiedPreview-0.3.0-macOS-arm64
          path: |
            macos/dist/*.zip
            macos/dist/*.sha256
