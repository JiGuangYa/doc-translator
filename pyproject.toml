[project]
name = "doc-translator"
version = "0.2.0"
description = "Local-only document translation service: Office + PDF, LLM-powered, with encrypted secret storage"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ilysom0611" }]
keywords = ["translation", "llm", "office", "docx", "pptx", "xlsx", "pdf", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Linguistic",
]
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # Line length is governed by line-length and human review; CJK comments are often wide.
    "B008",  # FastAPI idiom: Depends/File etc. are called in parameter defaults.
]

[tool.ruff.lint.per-file-ignores]
# Format layer uses closures to read the current loop context (flush callback);
# values are consumed within the same iteration, so this is not a late-binding bug.
"app/formats/*" = ["B023", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage thresholds (informational; CI reports but does not gate).
[tool.coverage.run]
source = ["app"]
branch = true
[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
